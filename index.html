<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MeshMind — Distributed AI Memory for Industrial Machines</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <circle cx="16" cy="16" r="3" fill="var(--amber)"/>
          <circle cx="5" cy="6" r="2.2" fill="var(--cyan)"/>
          <circle cx="27" cy="6" r="2.2" fill="var(--cyan)"/>
          <circle cx="5" cy="26" r="2.2" fill="var(--cyan)"/>
          <circle cx="27" cy="26" r="2.2" fill="var(--cyan)"/>
          <line x1="16" y1="16" x2="5" y2="6" stroke="var(--border-strong)" stroke-width="1.4"/>
          <line x1="16" y1="16" x2="27" y2="6" stroke="var(--border-strong)" stroke-width="1.4"/>
          <line x1="16" y1="16" x2="5" y2="26" stroke="var(--border-strong)" stroke-width="1.4"/>
          <line x1="16" y1="16" x2="27" y2="26" stroke="var(--border-strong)" stroke-width="1.4"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">MeshMind</div>
        <div class="brand-sub">Distributed AI Memory for Industrial Machines</div>
      </div>
    </div>

    <div class="header-status" id="header-status">
      <!-- populated by js/app.js: renderHeaderStatus() -->
    </div>
  </header>

  <!-- ============ MAIN LAYOUT ============ -->
  <main class="layout">

    <!-- ---- MACHINE LIST (SIDEBAR) ---- -->
    <aside class="panel machine-panel">
      <h2 class="panel-title">Machines</h2>
      <div id="machine-list" class="machine-list">
        <!-- populated by js/app.js: renderMachineList() -->
      </div>

      <div class="machine-detail" id="machine-detail">
        <!-- populated by js/app.js: renderMachineDetail() -->
      </div>
    </aside>

    <!-- ---- CONTENT COLUMN ---- -->
    <div class="content">

      <!-- SENSOR MONITORING -->
      <section class="panel">
        <h2 class="panel-title">Sensor Monitoring</h2>
        <div class="sensor-grid" id="sensor-grid">
          <!-- populated by js/app.js: renderSensors() -->
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">LOCAL MEMORY SEARCH</h2>
        <div id="local-search-panel" aria-live="polite">
          <!-- Machine B anomaly query and machine-scoped search result -->
        </div>
      </section>

      <!-- MEMORY + PEER ROW -->
      <div class="two-col">
        <section class="panel">
          <h2 class="panel-title">Local Memory</h2>
          <div id="memory-panel">
            <!-- populated by js/app.js: renderMemory() -->
          </div>
        </section>

        <section class="panel">
          <h2 class="panel-title">Peer Knowledge</h2>
          <div id="peer-panel">
            <!-- populated by js/app.js: renderPeers() -->
          </div>
        </section>
      </div>

      <!-- AI RECOMMENDATION -->
      <section class="panel">
        <h2 class="panel-title">AI Recommendation</h2>
        <div id="ai-panel">
          <!-- populated by js/app.js: renderAI() -->
        </div>
      </section>

      <!-- TECHNICIAN VERIFICATION -->
      <section class="panel">
        <h2 class="panel-title">Technician Verification</h2>
        <div id="verification-panel">
          <!-- populated by js/app.js: renderVerification() -->
        </div>
      </section>

      <!-- SYNCHRONIZATION -->
      <section class="panel">
        <h2 class="panel-title">Synchronization</h2>
        <div id="sync-panel">
          <!-- populated by js/app.js: renderSync() -->
        </div>
      </section>

    </div>
  </main>

  <footer class="app-footer">
    MeshMind prototype — frontend shell only. All data below is static/mock.
  </footer>

  <script src="js/data.js"></script>
  <script src="js/sensorSimulator.js"></script>
  <script src="js/anomalyDetector.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
